<!DOCTYPE html>
<html>
<head>
    <title>Text Animation</title>
</head>
<body>

    <h1 id="text">TEXT-GROWING</h1>

    <script>
        var text = document.getElementById("text");
        var size = 5;
        var growing = true;

        text.style.color = "red";
        text.style.fontSize = size + "pt";

        var timer = setInterval(function() {

            if (growing) {
                size++;
                text.innerHTML = "TEXT-GROWING";
                text.style.color = "red";

                if (size >= 50) {
                    growing = false;
                    text.innerHTML = "TEXTSHRINKING";
                    text.style.color = "blue";
                }
            }
            else {
                size--;

                if (size <= 5) {
                    clearInterval(timer);
                }
            }

            text.style.fontSize = size + "pt";

        }, 100);
    </script>

</body>
</html>
